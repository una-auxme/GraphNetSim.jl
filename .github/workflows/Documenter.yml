name: Documenter

# Manual-only. GitHub Actions path filters match file paths, not diff content, so
# there is no way to trigger solely on docstring changes. Rather than rebuilding on
# every push/PR, the docs are deployed on demand from the Actions tab
# ("Run workflow"). Remember to run it after merging docstring or docs/ changes.
on:
  workflow_dispatch:
jobs:
  build:
    permissions:
      contents: write
      statuses: write
    runs-on: ubuntu-latest
    steps:
      - name: "Check out repository"
        uses: actions/checkout@v7

      - name: "Set up Julia"
        uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'   # Octopus 0.2 requires Julia ≥ 1.12 (see Project.toml [compat])
          arch: x64

      - name: "Copy readme to doc"
        run:
          cp ./README.md ./docs/src/index.md

      - name: "Install dependencies"
        run: julia --project=docs/ -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
      - name: "Build and deploy"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
        run: julia --project=docs/ docs/make.jl
